name: Deploy to Netlify

# 说明：新建 GitHub 账号的 Actions 存在临时风控限制，暂时无法在云端运行。
# 当前自动部署由本地 git pre-push 钩子负责（push 时用 Netlify CLI 部署）。
# 等 GitHub 解除新账号限制后，把下面的 push 触发取消注释即可恢复云端持续部署。
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Netlify (production)
        run: npx netlify-cli@latest deploy --prod --dir . --message "CI: ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
